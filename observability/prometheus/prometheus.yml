global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: code-judge-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - backend-api:4100

  - job_name: code-judge-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - judge-worker:4101
