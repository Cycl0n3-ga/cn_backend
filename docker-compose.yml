services:
  redis:
    image: redis:7-alpine
    container_name: code-judge-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 6

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-api
    container_name: code-judge-backend
    expose:
      - '4100'
    ports:
      - '${HOST_PORT:-4100}:${PORT:-4100}'
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/code_judge.db}
      SQLITE_DB_FILE: ${SQLITE_DB_FILE:-/app/data/code_judge.db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required and must be at least 32 characters}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-86400}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://online-code-judge-phi.vercel.app}
      NODE_ENV: production
      PORT: ${PORT:-4100}
      JUDGE_QUEUE_DRIVER: redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-2}
      JUDGE_JOB_ATTEMPTS: ${JUDGE_JOB_ATTEMPTS:-3}
      JUDGE_STUCK_AFTER_SECONDS: ${JUDGE_STUCK_AFTER_SECONDS:-300}
      # Optional: seed demo data on startup (WARNING: seed wipes existing data)
      SEED_DB: ${SEED_DB:-false}
    volumes:
      - backend_data:/app/data
    command: >
      sh -c "DB_DIR=$${SQLITE_DB_FILE%/*} && mkdir -p \"$$DB_DIR\" && touch \"$$SQLITE_DB_FILE\" && npx prisma migrate deploy --schema prisma/schema.prisma && if [ \"$$SEED_DB\" = \"true\" ]; then node dist/prisma/seed.js; fi && npm run start:prod"
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:'' + (process.env.PORT || 4100) + ''/api/v1/health/ready'').then(r => r.ok ? r.json() : Promise.reject(new Error(''bad status''))).then(body => process.exit(body.status === ''UP'' ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  judge-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-worker
    container_name: code-judge-worker
    expose:
      - '4101'
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/code_judge.db}
      SQLITE_DB_FILE: ${SQLITE_DB_FILE:-/app/data/code_judge.db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required and must be at least 32 characters}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      NODE_ENV: production
      JUDGE_QUEUE_DRIVER: redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-2}
      JUDGE_JOB_ATTEMPTS: ${JUDGE_JOB_ATTEMPTS:-3}
      JUDGE_STUCK_AFTER_SECONDS: ${JUDGE_STUCK_AFTER_SECONDS:-300}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-4101}
      TMPDIR: ${JUDGE_TMP_DIR:-/tmp/code-judge-workspaces}
    volumes:
      - backend_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${JUDGE_TMP_DIR:-/tmp/code-judge-workspaces}:${JUDGE_TMP_DIR:-/tmp/code-judge-workspaces}
    depends_on:
      backend-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: code-judge-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend-api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: code-judge-prometheus
    restart: unless-stopped
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--web.enable-lifecycle'
      - '--web.external-url=/prometheus/'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'promtool query instant http://127.0.0.1:9090/prometheus up >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  grafana:
    image: grafana/grafana:10.4.5
    container_name: code-judge-grafana
    restart: unless-stopped
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s:%(port)s/grafana/'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: code-judge-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: code-judge-kibana
    restart: unless-stopped
    ports:
      - '5601:5601'
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: code-judge-filebeat
    restart: unless-stopped
    user: root
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    depends_on:
      - elasticsearch

volumes:
  backend_data:
  redis_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
